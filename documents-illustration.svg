    <rect x="200" y="140" width="34" height="5" rx="2.5" fill="#ECBD4C"/>
    <rect x="200" y="152" width="28" height="4" rx="2" fill="#FFFFFF" fill-opacity=".45"/>
    <rect x="200" y="162" width="32" height="4" rx="2" fill="#FFFFFF" fill-opacity=".45"/>
    <rect x="200" y="172" width="24" height="4" rx="2" fill="#FFFFFF" fill-opacity=".45"/>
    <rect x="200" y="200" width="34" height="5" rx="2.5" fill="#ECBD4C"/>
    <rect x="200" y="212" width="30" height="4" rx="2" fill="#FFFFFF" fill-opacity=".45"/>
    <rect x="200" y="222" width="26" height="4" rx="2" fill="#FFFFFF" fill-opacity=".45"/>
    <rect x="264" y="88" width="90" height="11" rx="5.5" fill="#0B2545"/>
    <rect x="264" y="106" width="60" height="7" rx="3.5" fill="#E2A92A"/>
    <rect x="264" y="136" width="48" height="6" rx="3" fill="#1E4D85"/>
    <rect x="264" y="150" width="96" height="5" rx="2.5" fill="#E1E6EE"/>
    <rect x="264" y="161" width="88" height="5" rx="2.5" fill="#E1E6EE"/>
    <rect x="264" y="172" width="92" height="5" rx="2.5" fill="#E1E6EE"/>
    <rect x="264" y="198" width="48" height="6" rx="3" fill="#1E4D85"/>
    <rect x="264" y="212" width="96" height="5" rx="2.5" fill="#E1E6EE"/>
    <rect x="264" y="223" width="84" height="5" rx="2.5" fill="#E1E6EE"/>
    <rect x="264" y="234" width="90" height="5" rx="2.5" fill="#E1E6EE"/>
    <rect x="264" y="260" width="48" height="6" rx="3" fill="#1E4D85"/>
    <rect x="264" y="274" width="92" height="5" rx="2.5" fill="#E1E6EE"/>
    <rect x="264" y="285" width="78" height="5" rx="2.5" fill="#E1E6EE"/>
    <rect x="264" y="310" width="40" height="6" rx="3" fill="#E2A92A" fill-opacity=".6"/>
    <rect x="310" y="310" width="40" height="6" rx="3" fill="#E2A92A" fill-opacity=".35"/>
  </g>

  <!-- pen tile -->
  <g filter="url(#ds)">
    <rect x="232" y="350" width="96" height="62" rx="18" fill="url(#dg)"/>
    <path d="M262 392l4-12 20-20 8 8-20 20z" fill="none" stroke="#0B2545" stroke-width="3" stroke-linejoin="round"/>
    <path d="M282 364l8 8" stroke="#0B2545" stroke-width="3"/>
    <path d="M300 392h12" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
