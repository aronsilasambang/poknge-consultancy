<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Illustration of a boarding pass, a mobile phone showing a completed online check-in and a plane on a flight path" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081C38"/>
      <stop offset=".6" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#133A68"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DC98"/>
      <stop offset="1" stop-color="#E2A92A"/>
    </linearGradient>
    <pattern id="tp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 1 39 20 20 39 1 20Z" fill="none" stroke="#E2A92A" stroke-opacity=".09"/>
    </pattern>
    <filter id="ts" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020814" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="560" height="440" fill="url(#tbg)"/>
  <rect width="560" height="440" fill="url(#tp)"/>
  <circle cx="470" cy="70" r="120" fill="#E2A92A" fill-opacity=".07"/>
  <circle cx="90" cy="400" r="110" fill="#0F7F79" fill-opacity=".12"/>

  <!-- flight path -->
  <path d="M52 330C140 180 300 120 470 92" fill="none" stroke="#E2A92A" stroke-opacity=".55" stroke-width="2.4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="52" cy="330" r="7" fill="#E2A92A"/>
  <circle cx="52" cy="330" r="14" fill="none" stroke="#E2A92A" stroke-opacity=".4"/>

  <!-- plane -->
  <g transform="translate(470 92) rotate(-12) scale(2.6) translate(-12 -12)">
    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width=".6" stroke-linejoin="round" transform="rotate(45 12 12)"/>
  </g>

  <!-- boarding pass -->
  <g filter="url(#ts)" transform="rotate(-6 230 250)">
    <path d="M70 176a14 14 0 0 1 14-14h228v176H84a14 14 0 0 1-14-14z" fill="#FFFFFF"/>
    <path d="M312 162h56a14 14 0 0 1 14 14v148a14 14 0 0 1-14 14h-56z" fill="url(#tg)"/>
    <path d="M312 170v160" stroke="#0B2545" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M84 162h228v40H84a14 14 0 0 1-14-14v-12a14 14 0 0 1 14-14z" fill="#0B2545"/>
    <rect x="90" y="176" width="92" height="10" rx="5" fill="#ECBD4C"/>
    <rect x="236" y="176" width="58" height="10" rx="5" fill="#FFFFFF" fill-opacity=".55"/>
    <!-- from / to -->
    <rect x="92" y="222" width="40" height="7" rx="3.5" fill="#C3CCD9"/>
    <rect x="92" y="236" width="62" height="18" rx="5" fill="#0B2545"/>
    <rect x="230" y="222" width="40" height="7" rx="3.5" fill="#C3CCD9"/>
    <rect x="230" y="236" width="62" height="18" rx="5" fill="#0B2545"/>
    <path d="M168 245h46" stroke="#E2A92A" stroke-width="2.4" stroke-dasharray="3 5" stroke-linecap="round"/>
    <path d="m208 239 7 6-7 6" fill="none" stroke="#E2A92A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- details -->
    <rect x="92" y="276" width="36" height="6" rx="3" fill="#C3CCD9"/>
    <rect x="92" y="288" width="52" height="9" rx="4.5" fill="#1E4D85"/>
    <rect x="166" y="276" width="36" height="6" rx="3" fill="#C3CCD9"/>
    <rect x="166" y="288" width="44" height="9" rx="4.5" fill="#1E4D85"/>
    <rect x="232" y="276" width="36" height="6" rx="3" fill="#C3CCD9"/>
    <rect x="232" y="288" width="40" height="9" rx="4.5" fill="#1E4D85"/>
    <rect x="92" y="312" width="200" height="6" rx="3" fill="#E1E6EE"/>
    <!-- stub barcode -->
    <g fill="#0B2545" fill-opacity=".8">
      <rect x="326" y="200" width="3" height="96"/><rect x="333" y="200" width="6" height="96"/>
      <rect x="343" y="200" width="2" height="96"/><rect x="349" y="200" width="4" height="96"/>
      <rect x="357" y="200" width="2" height="96"/><rect x="362" y="200" width="5" height="96"/>
    </g>
  </g>

  <!-- phone with check-in done -->
  <g filter="url(#ts)">
    <rect x="374" y="168" width="128" height="232" rx="22" fill="#0A1E3A"/>
    <rect x="382" y="178" width="112" height="212" rx="16" fill="#FFFFFF"/>
    <rect x="420" y="186" width="36" height="6" rx="3" fill="#0A1E3A"/>
    <circle cx="438" cy="252" r="30" fill="#E6F4F3"/>
    <circle cx="438" cy="252" r="21" fill="#0F7F79"/>
    <path d="m428 252 7 7 13-14" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="400" y="298" width="76" height="9" rx="4.5" fill="#0B2545"/>
    <rect x="408" y="314" width="60" height="6" rx="3" fill="#C3CCD9"/>
    <rect x="398" y="340" width="80" height="28" rx="14" fill="url(#tg)"/>
    <rect x="414" y="351" width="48" height="6" rx="3" fill="#0B2545"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
